appId: com.gabrielmoreira.securestorageexample
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Secure Storage Example"
    timeout: 30000
- assertVisible: "Secure Storage Example"
- tapOn:
    id: "select-backend-expoSecureStore"
- assertVisible:
    id: "selected-backend-label"
- assertVisible: "Configured token"
- scrollUntilVisible:
    element:
      id: "selected-property-options"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "action-set"
    direction: DOWN
- tapOn:
    id: "action-set"
- tapOn:
    id: "action-get"
