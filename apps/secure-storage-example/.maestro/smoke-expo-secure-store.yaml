appId: com.gabrielmoreira.securestorageexample
---
- launchApp
- extendedWaitUntil:
    visible: "Secure Storage Example"
    timeout: 30000
- assertVisible: "Secure Storage Example"
- tapOn:
    id: "select-backend-expoSecureStore"
- assertVisible:
    id: "selected-backend-label"
- tapOn:
    id: "property-configuredToken"
- assertVisible: "secure-storage-example.configured-token"
- scrollUntilVisible:
    element:
      id: "action-set"
    direction: DOWN
- tapOn:
    id: "action-set"
- tapOn:
    id: "action-get"
- tapOn:
    id: "action-dump-json"
- scrollUntilVisible:
    element:
      id: "operation-status"
    direction: DOWN
- assertVisible: "get:ok"
- scrollUntilVisible:
    element:
      id: "debug-dump"
    direction: DOWN
- assertVisible: "configuredToken"
