appId: com.gabrielmoreira.securestorageexample
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "select-backend-reactNativeSensitiveInfo"
    timeout: 30000
- tapOn:
    id: "select-backend-reactNativeSensitiveInfo"
- assertVisible:
    id: "selected-backend-label"
- assertVisible: "Configured token"
- scrollUntilVisible:
    element:
      id: "selected-property-options"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "action-set"
    direction: DOWN
- tapOn:
    id: "action-set"
- tapOn:
    id: "action-get"
- scrollUntilVisible:
    element:
      id: "action-dump-json"
    direction: DOWN
- tapOn:
    id: "action-dump-json"
- scrollUntilVisible:
    element:
      id: "debug-dump"
    direction: DOWN
- assertVisible: "configuredToken"
