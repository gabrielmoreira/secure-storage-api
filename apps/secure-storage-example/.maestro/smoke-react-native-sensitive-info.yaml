appId: com.gabrielmoreira.securestorageexample
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "select-backend-reactNativeSensitiveInfo"
    timeout: 30000
- tapOn:
    id: "select-backend-reactNativeSensitiveInfo"
- assertVisible:
    id: "selected-backend-label"
- scrollUntilVisible:
    element:
      id: "action-seed"
    direction: DOWN
- tapOn:
    id: "action-seed"
- tapOn:
    id: "action-dump-json"
- assertVisible: "dump:ok"
- scrollUntilVisible:
    element:
      id: "property-refreshToken"
    direction: UP
- tapOn:
    id: "property-refreshToken"
- scrollUntilVisible:
    element:
      id: "toggle-bound-user"
    direction: UP
- tapOn:
    id: "toggle-bound-user"
- scrollUntilVisible:
    element:
      id: "action-get"
    direction: DOWN
- tapOn:
    id: "action-get"
- scrollUntilVisible:
    element:
      id: "operation-status"
    direction: DOWN
- assertVisible: "get:error"
