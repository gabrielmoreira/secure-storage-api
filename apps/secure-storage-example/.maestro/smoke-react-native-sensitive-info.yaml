appId: com.gabrielmoreira.securestorageexample
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "select-backend-reactNativeSensitiveInfo"
    timeout: 30000
- tapOn:
    id: "select-backend-reactNativeSensitiveInfo"
- assertVisible:
    id: "selected-backend-label"
- tapOn:
    id: "property-configuredToken"
- assertVisible: "secure-storage-example.configured-token"
- scrollUntilVisible:
    element:
      id: "action-set"
    direction: DOWN
- tapOn:
    id: "action-set"
- tapOn:
    id: "action-get"
- tapOn:
    id: "action-dump-json"
- scrollUntilVisible:
    element:
      id: "operation-status"
    direction: DOWN
- extendedWaitUntil:
    visible: "get:ok"
    timeout: 30000
- assertVisible: "get:ok"
- scrollUntilVisible:
    element:
      id: "debug-dump"
    direction: DOWN
- assertVisible: "configuredToken"
