[tools]
node = "25"
java = "17"
maestro = "cli-2.5.1"
"npm:zx" = "8.8.5"

[env]
MAESTRO_CLI_NO_ANALYTICS = "1"

[tasks.validate]
description = "Run workspace validation"
run = "npm test && npm run check && npm run typecheck"

[tasks."example:prebuild"]
description = "Generate native project for the Expo example app"
run = "npm run prebuild -w secure-storage-example"

[tasks."example:android:build"]
description = "Build the Expo example app for Android"
depends = ["example:prebuild"]
run = "zx scripts/build-example-android.mjs"

[tasks."example:android:install"]
description = "Install the Expo example app on Android"
depends = ["example:prebuild"]
run = "zx scripts/build-example-android.mjs app:installDebug"

[tasks."example:metro"]
description = "Start Metro for the Expo example dev client"
run = "zx scripts/start-example-metro.mjs"

[tasks."example:android:maestro"]
description = "Run Android Maestro flows against an already running app and Metro"
run = "zx scripts/run-example-android-maestro.mjs --no-metro --no-install"

[tasks."example:android:e2e"]
description = "Build, install, and test the Expo example app on Android with Maestro"
run = "zx scripts/run-example-android-maestro.mjs"
