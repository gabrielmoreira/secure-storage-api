name: pull-request

on:
  pull_request:
  push:
    branches:
      - v0/node-phase0

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/secure-storage-api
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install workspace dependencies
        run: npm install
        working-directory: .
      - name: Run tests
        run: node --test
      - name: Run syntax check
        run: npm run check
      - name: Run typecheck
        run: npm run typecheck
