name: pull-request

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace-validation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Restore npm cache
        id: restore-npm-cache-validation
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - name: Install workspace dependencies
        run: npm install
      - name: Save npm cache
        if: always() && steps.restore-npm-cache-validation.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: ${{ steps.restore-npm-cache-validation.outputs.cache-primary-key }}
      - name: Run workspace validation through mise
        run: mise run validate
      - name: Run Expo prebuild smoke check through mise
        run: mise run example:prebuild

  android-example-maestro:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_EMULATOR_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
      ANDROID_SDK_ROOT: /home/runner/.android/sdk
      ANDROID_HOME: /home/runner/.android/sdk
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore npm cache
        id: restore-npm-cache-android
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - name: Restore Gradle cache
        id: restore-gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'apps/secure-storage-example/package.json', 'apps/secure-storage-example/android/**/*.gradle', 'apps/secure-storage-example/android/**/*.properties', 'apps/secure-storage-example/app.config.js') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Restore Android SDK cache
        id: restore-android-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ runner.os }}-android-sdk-api29-googleapis-x86_64-v1
      - name: Restore Android AVD cache
        id: restore-android-avd-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_AVD_HOME }}
          key: ${{ runner.os }}-android-avd-api29-googleapis-x86_64-nexus6-v1
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install workspace dependencies
        run: npm install
      - name: Save npm cache
        if: always() && steps.restore-npm-cache-android.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: ${{ steps.restore-npm-cache-android.outputs.cache-primary-key }}
      - name: Run Expo prebuild through mise
        run: mise run example:prebuild
      - name: Restore Android app build cache
        id: restore-android-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/secure-storage-example/android/.gradle
            apps/secure-storage-example/android/build
            apps/secure-storage-example/android/app/build
          key: ${{ runner.os }}-android-build-${{ hashFiles('package-lock.json', 'apps/secure-storage-example/package.json', 'apps/secure-storage-example/app.config.js', 'apps/secure-storage-example/android/**/*.gradle', 'apps/secure-storage-example/android/**/*.properties', 'apps/secure-storage-example/android/**/*.xml', 'apps/secure-storage-example/src/**/*.ts', 'apps/secure-storage-example/App.tsx', 'scripts/build-example-android.mjs', 'scripts/run-example-android-maestro.mjs', 'packages/secure-storage-api/src/**/*.ts', 'packages/secure-storage-expo-secure-store/src/**/*.ts', 'packages/secure-storage-react-native-keychain/src/**/*.ts', 'packages/secure-storage-react-native-sensitive-info/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-android-build-
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android emulator dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-29" "emulator" "system-images;android-29;google_apis;x86_64"
      - name: Save Android SDK cache
        if: always() && steps.restore-android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ steps.restore-android-sdk-cache.outputs.cache-primary-key }}
      - name: Create Android AVD
        if: steps.restore-android-avd-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n test -k "system-images;android-29;google_apis;x86_64" --device "Nexus 6"
      - name: Launch Android emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on &
          adb wait-for-device
          until adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; do sleep 5; done
          sleep 10
      - name: Build Android app through mise task
        run: mise run example:android:build
      - name: Save Android app build cache
        if: always() && steps.restore-android-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/secure-storage-example/android/.gradle
            apps/secure-storage-example/android/build
            apps/secure-storage-example/android/app/build
          key: ${{ steps.restore-android-build-cache.outputs.cache-primary-key }}
      - name: Run Android emulator and Maestro through mise task
        run: ANDROID_SERIAL=emulator-5554 mise run example:android:e2e
      - name: Shutdown emulator gracefully
        if: always()
        run: |
          adb -s emulator-5554 emu kill || true
          sleep 20
          find "$ANDROID_AVD_HOME" -name "*.lock" -delete || true
      - name: Save Android AVD cache
        if: always() && steps.restore-android-avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ANDROID_AVD_HOME }}
          key: ${{ steps.restore-android-avd-cache.outputs.cache-primary-key }}
      - name: Save Gradle cache
        if: always() && steps.restore-gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.restore-gradle-cache.outputs.cache-primary-key }}
